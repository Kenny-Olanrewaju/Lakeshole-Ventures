<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Premium gold gradient -->
    <linearGradient id="gold" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="15%" stop-color="#FFE55C"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="55%" stop-color="#DAA520"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    
    <!-- Soft top highlight -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Elegant multi-color background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="18%" stop-color="#FF8E53"/>
      <stop offset="35%" stop-color="#FFD166"/>
      <stop offset="52%" stop-color="#06D6A0"/>
      <stop offset="70%" stop-color="#118AB2"/>
      <stop offset="85%" stop-color="#073B4C"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    
    <!-- Soft radial accent -->
    <radialGradient id="radial" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="5" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#radial)"/>
  
  <!-- Subtle elegant curves -->
  <path d="M-50,180 C150,80 350,220 550,120 S850,200 900,100" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="60"/>
  <path d="M-50,620 C200,520 400,700 650,580 S900,650 950,550" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="70"/>
  
  <!-- Monogram -->
  <g transform="translate(400 390)" filter="url(#softShadow)">
    
    <!-- ========== LETTER L (TOP) ========== -->
    <!-- Outer L shape -->
    <path fill="url(#gold)" stroke="#7A5C0F" stroke-width="1.2" stroke-linejoin="round"
          d="M-95,-195
             C-95,-215 -75,-225 -55,-218
             L-25,-210
             C-5,-203 5,-185 5,-165
             L5,15
             C5,35 18,48 40,48
             L105,48
             C125,48 138,60 138,80
             C138,100 125,112 105,112
             L-55,112
             C-90,112 -115,90 -115,55
             L-115,-165
             C-115,-185 -108,-195 -95,-195 Z"/>
    
    <!-- L inner highlight -->
    <path fill="url(#shine)" opacity="0.45"
          d="M-75,-180
             C-75,-195 -60,-200 -45,-195
             L-20,-188
             C-5,-182 5,-168 5,-150
             L5,5
             C5,22 15,32 32,32
             L85,32
             C95,32 100,38 100,48
             C100,55 95,60 85,60
             L-40,60
             C-65,60 -80,48 -80,28
             L-80,-150
             C-80,-168 -78,-180 -75,-180 Z"/>
    
    <!-- ========== LETTER S (BOTTOM) - intertwined ========== -->
    <!-- Main S form -->
    <path fill="url(#gold)" stroke="#7A5C0F" stroke-width="1.2" stroke-linejoin="round"
          d="M45,25
             C85,5 120,-25 112,-70
             C104,-115 60,-140 15,-128
             C-30,-116 -55,-80 -42,-40
             C-30,0 5,25 45,25
             
             C85,50 115,90 100,140
             C85,190 35,215 -15,200
             C-65,185 -90,140 -70,95
             C-50,50 -5,30 40,45
             C70,55 90,80 80,115
             
             M25,55
             C-5,35 -25,5 -15,-30
             C-5,-65 30,-85 60,-70
             C90,-55 100,-20 85,15
             C70,50 40,55 25,55 Z"/>
    
    <!-- Cleaner refined S path for better silhouette -->
    <path fill="url(#gold)" stroke="#7A5C0F" stroke-width="0.8"
          d="M35,-15
             C65,-40 100,-30 105,5
             C110,40 85,60 50,65
             C15,70 -10,45 -5,10
             C0,-25 30,-15 35,-15
             
             M50,65
             C95,80 120,125 100,170
             C80,215 30,225 -10,205
             C-50,185 -70,140 -50,105
             C-30,70 15,60 50,65
             
             M-5,10
             C-25,-15 -25,-50 5,-65
             C35,-80 70,-60 70,-25
             C70,10 45,30 20,25
             C5,20 -5,10 -5,10 Z"/>
    
    <!-- S highlight -->
    <path fill="url(#shine)" opacity="0.4"
          d="M45,5
             C65,-10 85,-5 88,15
             C91,35 75,48 55,50
             C35,52 20,38 22,18
             C24,-2 40,5 45,5 Z"/>
    
    <!-- Interlocking flourish connecting L and S -->
    <path fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
          d="M-45,35
             C-10,15 25,10 55,30
             C75,42 90,65 80,90"/>
    
    <path fill="none" stroke="url(#shine)" stroke-width="5" stroke-linecap="round" opacity="0.45"
          d="M-35,42
             C0,25 30,22 55,38"/>
  </g>
  
  <!-- Subtle elegant outer ring -->
  <circle cx="400" cy="390" r="290" fill="none" stroke="rgba(255,215,0,0.07)" stroke-width="1.5"/>
</svg>
